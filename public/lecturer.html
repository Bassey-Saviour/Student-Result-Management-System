<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/public/css/styles.css">
  <title>Lecturer View - SRMS</title>
</head>

<body>
  <header>
    <h1>Student Result Management System - Lecturer View</h1>
  </header>
  <nav>
    <a href="index.html" class="nav-link">Home</a>
    <a href="student.html" class="nav-link">Student View</a>
    <a href="admin.html" class="nav-link">Admin View</a>
  </nav>
  <main class="container">
    <h2 class="text-center mb-1">Lecturer Portal</h2>

    <!-- Lecturer Login Section -->
    <section id="lecturer-login" class="form-card">
      <h3>Login</h3>
      <form id="login-form" aria-label="Lecturer Login Form">
        <label for="lecturerEmail">Email:</label>
        <input type="email" id="lecturerEmail" name="lecturerEmail" placeholder="Enter your email" required />
        <button type="submit" class="btn">Login</button>
      </form>
    </section>

    <!-- Upload Result Section (hidden until login) -->
    <section id="upload-section" class="hidden">
      <h2 class="text-center mb-1">Upload Result</h2>
      <form id="upload-form" aria-label="Lecturer Result Upload Form" class="form-card">
        <label for="courseSelect">Course:</label>
        <select id="courseSelect" name="course" required>
          <option value="">Select course</option>
          <!-- Courses will be populated here by JavaScript -->
        </select>

        <label for="studentMatric">Student Matric No:</label>
        <input type="text" id="studentMatric" name="studentMatric" placeholder="Enter student matric number" required />

        <label for="scoreInput">Total Score:</label>
        <input type="number" id="scoreInput" name="score" min="0" max="100" placeholder="Enter total score" required />

        <button type="submit" class="btn">Upload Result</button>
      </form>
      <section id="upload-status" class="upload-status">
        <p>Result uploaded successfully (simulated).</p>
      </section>
    </section>
  </main>
  <footer>
    &copy; 2024 SRMS Frontend. All rights reserved.
  </footer>
  <script>
    // Lecturer login and course loading
    const loginForm = document.getElementById('login-form');
    const uploadSection = document.getElementById('upload-section');
    const courseSelect = document.getElementById('courseSelect');
    const uploadForm = document.getElementById('upload-form');
    const uploadStatus = document.getElementById('upload-status');
    let currentLecturerEmail = '';

    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      const email = document.getElementById('lecturerEmail').value.trim();
      if (!email) return;

      try {
        const resp = await fetch('/cgi-bin/lecturer_courses.py?lecturer_email=' + encodeURIComponent(email), {
          method: 'GET',
          credentials: 'same-origin'
        });
        if (!resp.ok) throw new Error('Network response was not ok');
        const data = await resp.json();
        if (data.error) {
          alert('Error: ' + data.error);
          return;
        }

        if (!data.courses || data.courses.length === 0) {
          alert('No courses found for ' + email);
          return;
        }

        // Populate course dropdown
        courseSelect.innerHTML = '<option value="">Select course</option>';
        data.courses.forEach(course => {
          const option = document.createElement('option');
          option.value = course.course_id;
          option.textContent = course.course_code + ' - ' + course.course_title;
          courseSelect.appendChild(option);
        });

        currentLecturerEmail = email;
        document.getElementById('lecturer-login').style.display = 'none';
        uploadSection.classList.remove('hidden');
      } catch (err) {
        alert('Failed to load courses: ' + err.message);
      }
    });

    // Handle result upload to backend
    uploadForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      const courseId = document.getElementById('courseSelect').value;
      const matric = document.getElementById('studentMatric').value.trim();
      const scoreVal = document.getElementById('scoreInput').value;

      if (!courseId || !matric || !scoreVal) {
        alert('Please fill in all fields');
        return;
      }

      try {
        const params = new URLSearchParams({
          course_id: courseId,
          matric_no: matric,
          score: scoreVal
        });

        const resp = await fetch('/cgi-bin/upload_results.py', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params.toString()
        });

        if (!resp.ok) throw new Error('Network response was not ok');
        const data = await resp.json();

        if (data.error) {
          alert('Error: ' + data.error);
          return;
        }

        // Show success message
        const statusMsg = uploadStatus.querySelector('p');
        statusMsg.textContent = 'Result uploaded successfully! Grade: ' + data.grade;
        uploadStatus.style.display = 'block';
        setTimeout(() => {
          uploadStatus.style.display = 'none';
          uploadForm.reset();
        }, 3000);
      } catch (err) {
        alert('Failed to upload result: ' + err.message);
      }
    });
  </script>
</body>

</html>
