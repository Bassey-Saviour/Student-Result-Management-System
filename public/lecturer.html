<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/public/css/styles.css">
  <link rel="icon" type="image/png" href="images/results-icon-png-17974-removebg-preview.png">
  <title>Lecturer View - SRMS</title>
</head>

<body>
  <header>
    <h1>Student Result Management System - Lecturer View</h1>
  </header>
  <nav>
    <a href="index.html" class="nav-link">Home</a>
    <a href="student.html" class="nav-link">Student View</a>
    <a href="admin.html" class="nav-link">Admin View</a>
  </nav>
  <main class="container">
    <h2 class="text-center mb-1">Lecturer Portal</h2>

    <!-- Lecturer Login Section -->
    <section id="lecturer-login" class="form-card">
      <h3>Login</h3>
      <form id="login-form" aria-label="Lecturer Login Form">
        <label for="lecturerUsername">Username:</label>
        <input type="text" id="lecturerUsername" name="lecturerUsername" placeholder="Enter your first name" required />
        <label for="lecturerPassword">Password:</label>
        <input type="password" id="lecturerPassword" name="lecturerPassword" placeholder="Enter your password"
          required />
        <div id="login-error" class="error-message" style="display: none;"></div>
        <button type="submit" class="btn">Login</button>
      </form>
    </section>

    <!-- Upload Result Section (hidden until login) -->
    <section id="upload-section" class="hidden">
      <h2 class="text-center mb-1">Upload Result</h2>
      <form id="course-select-form" class="form-card">
        <label for="courseSelect">Course:</label>
        <select id="courseSelect" name="course" required>
          <option value="">Select course</option>
          <!-- Courses will be populated here by JavaScript -->
        </select>
      </form>

      <!-- Students Table Section (hidden until course is selected) -->
      <section id="students-table-section" class="hidden">
        <h3 id="course-title"></h3>
        <table aria-label="Students Result Table" role="table">
          <thead>
            <tr>
              <th>Matric No</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Score</th>
              <th>Grade</th>
            </tr>
          </thead>
          <tbody id="students-table-body">
            <!-- Students will be populated here -->
          </tbody>
        </table>
        <button type="button" id="submit-scores-btn" class="btn">Submit All Scores</button>
        <div id="upload-error" class="error-message" style="display: none;"></div>
      </section>

      <section id="upload-status" class="upload-status">
        <p>Results uploaded successfully!</p>
      </section>
    </section>
  </main>
  <footer>
    &copy; 2025 SRMS Frontend. All rights reserved.
  </footer>
  <script src="/public/js/lecturer.js"></script>
</body>

</html>
