<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/public/css/styles.css">
  <link rel="icon" type="image/png" href="images/results-icon-png-17974-removebg-preview.png">
  <title>Lecturer View - SRMS</title>
</head>

<body>
  <header>
    <h1>Student Result Management System - Lecturer View</h1>
  </header>
  <nav>
    <a href="index.html" class="nav-link">Home</a>
    <a href="student.html" class="nav-link">Student View</a>
    <a href="admin.html" class="nav-link">Admin View</a>
  </nav>
  <main class="container">
    <h2 class="text-center mb-1">Lecturer Portal</h2>

    <!-- Lecturer Login Section -->
    <section id="lecturer-login" class="form-card">
      <h3>Login</h3>
      <form id="login-form" aria-label="Lecturer Login Form">
        <label for="lecturerUsername">Username:</label>
        <input type="text" id="lecturerUsername" name="lecturerUsername" placeholder="Enter your first name" required />
        <label for="lecturerPassword">Password:</label>
        <input type="password" id="lecturerPassword" name="lecturerPassword" placeholder="Enter your password"
          required />
        <div id="login-error" class="error-message" style="display: none;"></div>
        <button type="submit" class="btn">Login</button>
      </form>
    </section>

    <!-- Upload Result Section (hidden until login) -->
    <section id="upload-section" class="hidden">
      <h2 class="text-center mb-1">Upload Result</h2>
      <form id="course-select-form" class="form-card">
        <label for="courseSelect">Course:</label>
        <select id="courseSelect" name="course" required>
          <option value="">Select course</option>
          <!-- Courses will be populated here by JavaScript -->
        </select>
      </form>

      <!-- Students Table Section (hidden until course is selected) -->
      <section id="students-table-section" class="hidden">
        <h3 id="course-title"></h3>
        <table aria-label="Students Result Table" role="table">
          <thead>
            <tr>
              <th>Matric No</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Score</th>
              <th>Grade</th>
            </tr>
          </thead>
          <tbody id="students-table-body">
            <!-- Students will be populated here -->
          </tbody>
        </table>
        <button type="button" id="submit-scores-btn" class="btn">Submit All Scores</button>
        <div id="upload-error" class="error-message" style="display: none;"></div>
      </section>

      <section id="upload-status" class="upload-status">
        <p>Results uploaded successfully!</p>
      </section>
    </section>
  </main>
  <footer>
    &copy; 2025 SRMS Frontend. All rights reserved.
  </footer>
  <script>
    // Helper function to convert score to grade
    function scoreToGrade(score) {
      const s = parseInt(score) || 0;
      if (s >= 80) return 'A';
      if (s >= 60) return 'B';
      if (s >= 50) return 'C';
      if (s >= 45) return 'D';
      if (s >= 40) return 'E';
      return 'F';
    }

    // Lecturer login and course loading
    const loginForm = document.getElementById('login-form');
    const uploadSection = document.getElementById('upload-section');
    const courseSelect = document.getElementById('courseSelect');
    const courseSelectForm = document.getElementById('course-select-form');
    const studentsTableSection = document.getElementById('students-table-section');
    const courseTitle = document.getElementById('course-title');
    const tbody = document.getElementById('students-table-body');
    const loginError = document.getElementById('login-error');
    const uploadError = document.getElementById('upload-error');
    const uploadStatus = document.getElementById('upload-status');
    const submitScoresBtn = document.getElementById('submit-scores-btn');
    let currentCourseId = null;
    let studentsData = [];

    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      const username = document.getElementById('lecturerUsername').value.trim();
      const password = document.getElementById('lecturerPassword').value;
      if (!username || !password) return;

      // Clear previous errors
      loginError.style.display = 'none';
      loginError.textContent = '';

      try {
        const params = new URLSearchParams({
          username: username,
          password: password
        });

        const resp = await fetch('/cgi-bin/lecturer_courses.py', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params.toString()
        });
        if (!resp.ok) throw new Error('Network response was not ok');
        const data = await resp.json();
        if (data.error) {
          loginError.textContent = 'Error: ' + data.error;
          loginError.style.display = 'block';
          return;
        }

        if (!data.courses || data.courses.length === 0) {
          loginError.textContent = 'No courses found for this lecturer';
          loginError.style.display = 'block';
          return;
        }

        // Populate course dropdown
        courseSelect.innerHTML = '<option value="">Select course</option>';
        data.courses.forEach(course => {
          const option = document.createElement('option');
          option.value = course.course_id;
          option.textContent = course.course_code + ' - ' + course.course_title;
          courseSelect.appendChild(option);
        });

        document.getElementById('lecturer-login').style.display = 'none';
        uploadSection.classList.remove('hidden');
      } catch (err) {
        loginError.textContent = 'Failed to load courses: ' + err.message;
        loginError.style.display = 'block';
      }
    });

    // Handle course selection
    courseSelect.addEventListener('change', async function () {
      const courseId = this.value;
      if (!courseId) {
        studentsTableSection.classList.add('hidden');
        return;
      }

      currentCourseId = courseId;
      uploadError.style.display = 'none';
      uploadError.textContent = '';

      try {
        const resp = await fetch('/cgi-bin/get_course_students.py?course_id=' + encodeURIComponent(courseId), {
          method: 'GET',
          credentials: 'same-origin'
        });
        if (!resp.ok) throw new Error('Network response was not ok');
        const data = await resp.json();
        if (data.error) {
          uploadError.textContent = 'Error: ' + data.error;
          uploadError.style.display = 'block';
          return;
        }

        // Set course title
        courseTitle.textContent = data.course_code + ' - ' + data.course_title;

        // Store students data and render table
        studentsData = data.students || [];
        tbody.innerHTML = '';

        if (studentsData.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No students found</td></tr>';
        } else {
          studentsData.forEach((student, idx) => {
            const tr = document.createElement('tr');
            const scoreInput = document.createElement('input');
            scoreInput.type = 'number';
            scoreInput.min = '0';
            scoreInput.max = '100';
            scoreInput.value = student.score || '';
            scoreInput.dataset.studentIdx = idx;
            scoreInput.dataset.studentId = student.student_id;
            scoreInput.class = 'score-input';

            const gradeCell = document.createElement('td');
            gradeCell.className = 'grade-cell';
            gradeCell.textContent = student.grade || '';
            gradeCell.dataset.studentIdx = idx;

            // Auto-update grade on score input
            scoreInput.addEventListener('input', function () {
              const grade = this.value ? scoreToGrade(this.value) : '';
              gradeCell.textContent = grade;
            });

            const scoreTd = document.createElement('td');
            scoreTd.appendChild(scoreInput);

            tr.innerHTML = `
              <td>${student.matric_no}</td>
              <td>${student.first_name}</td>
              <td>${student.last_name}</td>
            `;
            tr.appendChild(scoreTd);
            tr.appendChild(gradeCell);
            tbody.appendChild(tr);
          });
        }

        studentsTableSection.classList.remove('hidden');
      } catch (err) {
        uploadError.textContent = 'Failed to load students: ' + err.message;
        uploadError.style.display = 'block';
      }
    });

    // Handle submit all scores
    submitScoresBtn.addEventListener('click', async function () {
      uploadError.style.display = 'none';
      uploadError.textContent = '';

      // Collect all scores
      const scoreInputs = tbody.querySelectorAll('input[type="number"]');
      const updates = [];

      scoreInputs.forEach(input => {
        const studentId = input.dataset.studentId;
        const score = input.value.trim();

        if (score === '') {
          return; // Skip empty scores
        }

        try {
          const scoreVal = parseInt(score);
          if (scoreVal < 0 || scoreVal > 100) {
            throw new Error('Score must be between 0 and 100');
          }
          updates.push({
            course_id: currentCourseId,
            student_id: studentId,
            score: scoreVal
          });
        } catch (e) {
          uploadError.textContent = 'Error: ' + e.message;
          uploadError.style.display = 'block';
          throw e;
        }
      });

      if (updates.length === 0) {
        uploadError.textContent = 'Error: No scores to submit';
        uploadError.style.display = 'block';
        return;
      }

      try {
        // Submit each score
        for (const update of updates) {
          const params = new URLSearchParams({
            course_id: update.course_id,
            student_id: update.student_id,
            score: update.score
          });

          const resp = await fetch('/cgi-bin/upload_results_by_student.py', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
          });

          if (!resp.ok) throw new Error('Failed to upload result');
          const data = await resp.json();
          if (data.error) throw new Error(data.error);
        }

        // Show success
        uploadStatus.style.display = 'block';
        setTimeout(() => {
          uploadStatus.style.display = 'none';
          courseSelect.value = '';
          studentsTableSection.classList.add('hidden');
        }, 3000);
      } catch (err) {
        uploadError.textContent = 'Failed to upload results: ' + err.message;
        uploadError.style.display = 'block';
      }
    });
  </script>
</body>

</html>
