<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="icon" type="image/png" href="images/results-icon-png-17974-removebg-preview.png">
  <title>Student View - SRMS</title>
</head>

<body>
  <header>
    <h1>Student Result Management System - Student View</h1>
  </header>
  <nav>
    <a href="index.html" class="nav-link">Home</a>
    <a href="lecturer.html" class="nav-link">Lecturer View</a>
    <a href="admin.html" class="nav-link">Admin View</a>
  </nav>
  <main class="container">
    <h2 class="text-center mb-1">View Your Results</h2>
    <form id="student-form" aria-label="Student Result Form" class="form-card">
      <label for="matricNo">Matriculation Number:</label>
      <input type="text" id="matricNo" name="matricNo" placeholder="Enter your matric number" required />
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" required />
      <div id="error-message" class="error-message" style="display: none;"></div>
      <button type="submit" class="btn">View Results</button>
    </form>
    <section id="results-section" class="results-section hidden">
      <h3 class="header">Your Results</h3>
      <table aria-label="Student Results Table" role="table">
        <thead>
          <tr>
            <th>Course Code</th>
            <th>Course Title</th>
            <th>Units</th>
            <th>Score</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody id="results-table-body">

        </tbody>
      </table>
      <p aria-live="polite" class="gpa-text">GPA: <span id="gpa-value">-</span></p>
    </section>
  </main>
  <footer>
    &copy; 2025 SRMS Frontend. All rights reserved.
  </footer>
  <script>
    // Fetch student results from CGI and render the table
    const form = document.getElementById('student-form');
    const resultsSection = document.getElementById('results-section');
    const tbody = document.getElementById('results-table-body');
    const gpaEl = document.getElementById('gpa-value');
    const errorMessage = document.getElementById('error-message');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const matric = document.getElementById('matricNo').value.trim();
      const password = document.getElementById('password').value;
      if (!matric || !password) return;

      // Clear previous errors
      errorMessage.style.display = 'none';
      errorMessage.textContent = '';

      try {
        const resp = await fetch('/api/student_results', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            matricNo: matric,
            password: password
          })
        });
        if (!resp.ok) throw new Error('Network response was not ok');
        const data = await resp.json();
        if (data.error) {
          errorMessage.textContent = 'Error: ' + data.error;
          errorMessage.style.display = 'block';
          resultsSection.classList.add('hidden');
          return;
        }

        // populate table
        tbody.innerHTML = '';
        if (!data.results || data.results.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5">No results found for ' + matric + '</td></tr>';
          gpaEl.textContent = '-';
        } else {
          data.results.forEach(r => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${r.course_code || ''}</td>
              <td>${r.course_title || ''}</td>
              <td>${r.credit_units || ''}</td>
              <td>${r.score || ''}</td>
              <td>${r.grade || ''}</td>
            `;
            tbody.appendChild(tr);
          });
          gpaEl.textContent = data.gpa !== null ? data.gpa : '-';
        }
        resultsSection.classList.remove('hidden');
      } catch (err) {
        errorMessage.textContent = 'Failed to load results: ' + err.message;
        errorMessage.style.display = 'block';
      }
    });
  </script>
</body>

</html>
